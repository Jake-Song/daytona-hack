[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentzero-sandbox"
version = "0.1.0"
description = "Observe, patch, and verify an agent's sandbox access policy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "daytona>=0.100,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agentzero*"]

[tool.setuptools.package-data]
agentzero = ["fixtures/*", "fixtures/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: creates and deletes a real Daytona sandbox (explicit opt-in)"]
